name: Update stats cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh SVG cards
        run: |
          set -u
          mkdir -p stats
          fetch() {
            local url="$1"
            local dest="$2"
            if curl -fsSL --max-time 40 "$url" -o "${dest}.tmp" \
              && grep -q "<svg" "${dest}.tmp" \
              && [ "$(wc -c < "${dest}.tmp")" -gt 2000 ]; then
              mv "${dest}.tmp" "$dest"
              echo "updated ${dest}"
            else
              rm -f "${dest}.tmp"
              echo "kept previous ${dest}"
            fi
          }
          fetch "https://github-readme-stats.shion.dev/api?username=nurd0tid&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&include_all_commits=true" stats/github-stats.svg
          fetch "https://github-readme-stats.shion.dev/api/top-langs/?username=nurd0tid&layout=compact&theme=tokyonight&hide_border=true&langs_count=8" stats/top-langs.svg
          fetch "https://streak-stats.demolab.com/?user=nurd0tid&theme=tokyonight&hide_border=true" stats/streak.svg
          fetch "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=nurd0tid&theme=tokyonight" stats/profile-details.svg
          fetch "https://github-profile-summary-cards.vercel.app/api/cards/productive-time?username=nurd0tid&theme=tokyonight" stats/productive-time.svg

      - name: Commit
        run: |
          git config user.name "Muhamad Nur"
          git config user.email "mnur29054@gmail.com"
          git add stats
          if git diff --cached --quiet; then
            echo "No stats changes"
          else
            git commit -m "Update GitHub stats cards"
            git push
          fi
